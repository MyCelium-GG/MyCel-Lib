name: Modrinth upload
description: >
  Uploads a MyCelium release to Modrinth: one version per loader jar (or one
  for a universal jar), changelog from CHANGELOG.md, required projects by
  slug. Takes the project from its input or from modrinth_project_id in
  gradle.properties. Skips (with a notice) when the project or token is
  missing, and skips loaders whose version is already there.

inputs:
  token:
    description: Modrinth personal access token (pass secrets.MODRINTH_TOKEN)
    required: true
  project-id:
    description: "Modrinth project id or slug (default: modrinth_project_id in gradle.properties)"
    default: ""
  name:
    description: Display name, e.g. "Better Pets"
    required: true
  version:
    description: Version being released (the tag)
    required: true
  files:
    description: One LOADER=PATH per line (fabric, forge, neoforge, or all for a universal jar)
    required: true
  require:
    description: Required project slugs, space separated
    default: mycel
  fabric-require:
    description: Extra required slugs for Fabric files, space separated
    default: fabric-api
  release-type:
    description: release, beta or alpha
    default: release
  dry-run:
    description: Resolve everything and print it without uploading
    default: "false"

runs:
  using: composite
  steps:
    - name: Upload to Modrinth
      shell: bash
      env:
        MODRINTH_TOKEN: ${{ inputs.token }}
        MR_NAME: ${{ inputs.name }}
        MR_VERSION: ${{ inputs.version }}
        MR_FILES: ${{ inputs.files }}
        MR_REQUIRE: ${{ inputs.require }}
        MR_FABRIC_REQUIRE: ${{ inputs.fabric-require }}
        MR_RELEASE_TYPE: ${{ inputs.release-type }}
        MR_DRY_RUN: ${{ inputs.dry-run }}
        MR_PROJECT: ${{ inputs.project-id }}
      run: |
        set -euo pipefail
        prop() { grep -E "^$1=" gradle.properties | head -1 | cut -d= -f2- | tr -d '[:space:]'; }
        PROJECT=${MR_PROJECT:-$(prop modrinth_project_id || true)}
        if [ -z "$PROJECT" ]; then
          echo "::notice::No modrinth_project_id in gradle.properties; skipping Modrinth."
          exit 0
        fi
        if [ -z "$MODRINTH_TOKEN" ]; then
          echo "::warning::MODRINTH_TOKEN secret is not set; skipping Modrinth."
          exit 0
        fi
        args=(--project "$PROJECT" --name "$MR_NAME" --version "$MR_VERSION"
              --mc "$(prop minecraft_version)" --release-type "$MR_RELEASE_TYPE")
        for slug in $MR_REQUIRE; do args+=(--require "$slug"); done
        for slug in $MR_FABRIC_REQUIRE; do args+=(--fabric-require "$slug"); done
        while IFS= read -r line; do
          line=$(echo "$line" | xargs)
          [ -z "$line" ] && continue
          loader=${line%%=*}
          pattern=${line#*=}
          # Only the main jar of exactly this version; never sources/javadoc jars.
          match=$(ls $pattern 2>/dev/null | grep -F -- "-$MR_VERSION.jar" | grep -vE -- '-(sources|javadoc)\.jar$' | head -1 || true)
          [ -n "$match" ] || { echo "::error::no $MR_VERSION jar matches $pattern"; exit 1; }
          args+=(--file "$loader=$match")
        done <<< "$MR_FILES"
        [ "$MR_DRY_RUN" = "true" ] && args+=(--dry-run)
        python3 "$GITHUB_ACTION_PATH/upload.py" "${args[@]}"
