name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # "" is the default (gradle.properties); others come from mc/*.properties.
        mc: ["", "26.2", "26.1"]
    name: build ${{ matrix.mc || 'default' }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - name: Build all loaders + example + tests
        run: ./gradlew build --no-daemon ${{ matrix.mc && format('-Pmc={0}', matrix.mc) || '' }}
