name: release

# Cut a release by pushing a version tag (e.g. 1.1.0): builds the universal
# jar, attaches it to a GitHub Release and uploads it to CurseForge (project
# 1726210, token in the CURSEFORGE_TOKEN secret) and Modrinth (project mycel,
# token in the MODRINTH_TOKEN secret). Run it by hand with an existing tag to
# (re)publish that version.
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
      curseforge:
        description: Upload to CurseForge
        type: boolean
        default: true
      modrinth:
        description: Upload to Modrinth
        type: boolean
        default: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - name: Build universal jar
        run: ./gradlew :universal:universalJar --no-daemon
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "GitHub Release $TAG already exists; leaving it as is."
            exit 0
          fi
          MC_VERSION=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)
          gh release create "$TAG" \
            --title "Mycel $TAG" \
            --notes "Universal jar for Minecraft $MC_VERSION (Fabric + Forge + NeoForge). Requires Java 25." \
            universal/build/libs/mycel-*.jar
      # The shared actions come from their v1 tag, not from the release's own
      # checkout, so tags made before an action existed can still be published.
      - name: Upload to CurseForge
        if: ${{ github.event_name == 'push' || inputs.curseforge }}
        uses: MyCelium-GG/MyCel-Lib/.github/actions/curseforge-upload@v1
        with:
          token: ${{ secrets.CURSEFORGE_TOKEN }}
          project-id: "1726210"
          environment: both
          name: Mycel
          version: ${{ env.TAG }}
          require: ""
          fabric-require: ""
          files: |
            all=universal/build/libs/mycel-*.jar
      - name: Upload to Modrinth
        if: ${{ github.event_name == 'push' || inputs.modrinth }}
        uses: MyCelium-GG/MyCel-Lib/.github/actions/modrinth-upload@v1
        with:
          token: ${{ secrets.MODRINTH_TOKEN }}
          project-id: mycel
          environment: client_or_server
          name: Mycel
          version: ${{ env.TAG }}
          require: ""
          fabric-require: ""
          files: |
            all=universal/build/libs/mycel-*.jar
      # Only for new tags: re-running an old release by hand must not announce
      # it again.
      - name: Announce on Discord
        if: ${{ github.event_name == 'push' }}
        uses: MyCelium-GG/MyCel-Lib/.github/actions/discord-announce@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          version: ${{ env.TAG }}
