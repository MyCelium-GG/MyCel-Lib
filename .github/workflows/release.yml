name: release

# Cut a release by pushing a version tag (e.g. 1.1.0): builds the universal
# jar, attaches it to a GitHub Release and uploads it to CurseForge (project 1726210,
# token in the CURSEFORGE_TOKEN secret). Run it by hand
# with an existing tag to (re)publish that version.
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
      curseforge:
        description: Upload to CurseForge
        type: boolean
        default: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      HAS_DOCS_DEPLOY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Build universal jar
        run: ./gradlew :universal:universalJar --no-daemon
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "GitHub Release $TAG already exists; leaving it as is."
            exit 0
          fi
          MC_VERSION=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)
          gh release create "$TAG" \
            --title "Mycel $TAG" \
            --notes "Universal jar for Minecraft $MC_VERSION (Fabric + Forge + NeoForge). Requires Java 25." \
            universal/build/libs/mycel-*.jar
      # From main, so tags made before the action existed can still be published.
      - name: Upload to CurseForge
        if: ${{ github.event_name == 'push' || inputs.curseforge }}
        uses: MyCelium-GG/MyCel-Lib/.github/actions/curseforge-upload@main
        with:
          token: ${{ secrets.CURSEFORGE_TOKEN }}
          project-id: "1726210"
          environment: both
          name: Mycel
          version: ${{ env.TAG }}
          require: ""
          fabric-require: ""
          files: |
            all=universal/build/libs/mycel-*.jar
      # Only for new tags: re-publishing an old tag by hand must not roll the
      # docs back. Needs a service-account JSON key for the
      # api-mycelium-gg-org Firebase project in FIREBASE_SERVICE_ACCOUNT.
      - name: Publish API docs to api.mycelium-gg.org
        if: ${{ github.event_name == 'push' && env.HAS_DOCS_DEPLOY == 'true' }}
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          ./gradlew :common:javadoc --no-daemon
          printf '%s' "$SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase.json" \
            npx --yes firebase-tools@14 deploy --only hosting --project api-mycelium-gg-org --non-interactive
