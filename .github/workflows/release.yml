name: release

# Cut a release by pushing a version tag (e.g. 1.1.0): builds the universal
# jar for every Minecraft line (the default from gradle.properties plus one per
# mc/*.properties), uploads each to CurseForge (project 1726210, token in the
# CURSEFORGE_TOKEN secret) for its game versions, attaches all of them to one
# GitHub Release and pushes a <tag>-<line> tag per extra line for JitPack.
# Run it by hand with an existing tag to (re)publish that version.
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
      curseforge:
        description: Upload to CurseForge
        type: boolean
        default: true

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # "" is the default line (gradle.properties); keep in sync with mc/.
        mc: ["", "26.2", "26.1"]
    name: publish ${{ matrix.mc || 'default' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - name: Build universal jar
        run: ./gradlew :universal:universalJar --no-daemon ${{ matrix.mc && format('-Pmc={0}', matrix.mc) || '' }}
      # MC_LINE names the jar; MC_VERSIONS are the game versions it is
      # published for (minecraft_versions, else minecraft_version).
      - name: Minecraft versions
        env:
          MC: ${{ matrix.mc }}
        run: |
          get() {
            local value=""
            [ -n "$MC" ] && value=$(grep -E "^$1=" "mc/$MC.properties" | head -1 | cut -d= -f2- || true)
            [ -n "$value" ] || value=$(grep -E "^$1=" gradle.properties | head -1 | cut -d= -f2- || true)
            echo "$value" | xargs
          }
          echo "MC_LINE=$(get minecraft_line)" >> "$GITHUB_ENV"
          versions=$(get minecraft_versions)
          echo "MC_VERSIONS=${versions:-$(get minecraft_version)}" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v7
        with:
          name: jar-${{ env.MC_LINE }}
          path: universal/build/libs/mycel-${{ env.MC_LINE }}-*.jar
          if-no-files-found: error
      # The shared actions come from their v1 tag, not from the release's own
      # checkout, so tags made before an action existed can still be published.
      - name: Upload to CurseForge
        if: ${{ github.event_name == 'push' || inputs.curseforge }}
        uses: MyCelium-GG/MyCel-Lib/.github/actions/curseforge-upload@v1
        with:
          token: ${{ secrets.CURSEFORGE_TOKEN }}
          project-id: "1726210"
          environment: both
          name: Mycel
          version: ${{ env.TAG }}
          minecraft-version: ${{ env.MC_VERSIONS }}
          require: ""
          fabric-require: ""
          files: |
            all=universal/build/libs/mycel-${{ env.MC_LINE }}-*.jar

  github:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v8
        with:
          pattern: jar-*
          path: jars
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "GitHub Release $TAG already exists; leaving it as is."
            exit 0
          fi
          gh release create "$TAG" \
            --title "Mycel $TAG" \
            --notes "Universal jars (Fabric + Forge + NeoForge), one per Minecraft line: pick the one named for your Minecraft (mycel-26.1 covers 26.1, 26.1.1 and 26.1.2). Requires Java 25." \
            jars/mycel-*.jar
      # JitPack builds one Minecraft line per tag (see jitpack.yml); mods for
      # 26.2 depend on com.github.MyCelium-GG:MyCel-Lib:<tag>-26.2, and so on.
      # Each such tag is a commit on top of the release adding .jitpack-mc,
      # since JitPack cannot tell the build which tag it is for.
      - name: Tag extra lines for JitPack
        run: |
          release=$(git rev-parse HEAD)
          for file in mc/*.properties; do
            line=$(basename "$file" .properties)
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG-$line" > /dev/null; then
              echo "Tag $TAG-$line already exists."
              continue
            fi
            git checkout -q --detach "$release"
            echo "$line" > .jitpack-mc
            git add .jitpack-mc
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "JitPack build of $TAG for Minecraft $line"
            git tag "$TAG-$line"
            git push origin "refs/tags/$TAG-$line"
          done

  # Only for new tags: re-running an old release by hand must not announce it
  # again.
  announce:
    needs: github
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Announce on Discord
        uses: MyCelium-GG/MyCel-Lib/.github/actions/discord-announce@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          version: ${{ env.TAG }}
