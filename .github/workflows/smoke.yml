name: smoke

# Starts the example mod on every loader: a dev server, plus a dev client (on
# a virtual display) that joins it and trades packets both ways. Catches what
# unit tests cannot: crashes at start-up, broken payload registration, players
# being kicked by a packet. See scripts/smoke.sh.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        loader: [fabric, neoforge, forge]
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Install a virtual display
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb libgl1-mesa-dri libglx-mesa0 libopenal1
      - name: Compile the example mod
        run: ./gradlew :example-${{ matrix.loader }}:classes --no-daemon
      # A fresh runner also downloads the game's assets during this run.
      - name: Join a dev server with a dev client
        env:
          SMOKE_SECONDS: "420"
          ALSOFT_DRIVERS: "null"
        run: xvfb-run -a -s "-screen 0 1280x720x24" scripts/smoke.sh ${{ matrix.loader }}
      - name: Keep the logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.loader }}
          path: build/smoke/${{ matrix.loader }}
