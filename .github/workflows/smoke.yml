name: smoke

# Starts the example mod on every loader: a dev server, plus a dev client (on
# a virtual display) that joins it and trades packets both ways. Catches what
# unit tests cannot: crashes at start-up, broken payload registration, players
# being kicked by a packet. See scripts/smoke.sh.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      all-lines:
        description: Test every Minecraft line, not just the default
        type: boolean
        default: true
  workflow_call:
    inputs:
      ref:
        type: string
      all-lines:
        type: boolean
        default: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        loader: [fabric, neoforge, forge]
        # Pushes test the default line; releases and manual runs test them all.
        mc: ${{ inputs.all-lines && fromJSON('["", "26.2", "26.1"]') || fromJSON('[""]') }}
    name: smoke ${{ matrix.loader }} ${{ matrix.mc || 'default' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - name: Install a virtual display
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb libgl1-mesa-dri libglx-mesa0 libegl-mesa0 mesa-utils mesa-vulkan-drivers vulkan-tools libopenal1
      - name: Check the virtual display has OpenGL
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24 +extension GLX +render" glxinfo -B | grep -E "OpenGL (renderer|core profile version)"
          # Which window formats exist (the game needs one with alpha, depth and stencil).
          xvfb-run -a -s "-screen 0 1280x720x24 +extension GLX +render" glxinfo | grep -A3 "GLX Visuals" | head -4 || true
          vulkaninfo --summary 2>/dev/null | grep -E "deviceName|VK_KHR_surface" | head -3 || true
      - name: Compile the example mod
        run: ./gradlew :example-${{ matrix.loader }}:classes --no-daemon ${{ matrix.mc && format('-Pmc={0}', matrix.mc) || '' }}
      # A fresh runner also downloads the game's assets during this run.
      - name: Join a dev server with a dev client
        env:
          SMOKE_SECONDS: "420"
          SMOKE_MC: ${{ matrix.mc }}
          ALSOFT_DRIVERS: "null"
          # No GPU on the runner: Mesa's software renderer, on a display with GLX.
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
        run: xvfb-run -a -s "-screen 0 1280x720x24 +extension GLX +extension RANDR +render -noreset" scripts/smoke.sh ${{ matrix.loader }}
      - name: Keep the logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-${{ matrix.loader }}-${{ matrix.mc || 'default' }}
          path: build/smoke/${{ matrix.loader }}
