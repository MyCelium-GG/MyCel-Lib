plugins {
    id 'java-library'
    id 'maven-publish'
}

base {
    archivesName = "${mod_id}-${project.name}-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
    withJavadocJar()
}

repositories {
    mavenCentral()
    // Plain repos (never exclusive): loader toolchains resolve sibling modules
    // across several prognoses (e.g. NeoForm -> mojang-meta), and exclusive
    // filters would hijack those lookups to the wrong repository.
    maven {
        name = 'Forge'
        url = 'https://maven.minecraftforge.net'
    }
    // Plain (non-exclusive): NeoForm's own metadata references sibling modules
    // that live in other repos (e.g. mojang-meta), so this must not be exclusive.
    maven {
        name = 'NeoForge'
        url = 'https://maven.neoforged.net/releases'
    }
    // Home of net.neoforged:minecraft-dependencies (required by every NeoForm).
    maven {
        name = 'MojangMeta'
        url = 'https://maven.neoforged.net/mojang-meta'
    }
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net'
    }
    maven {
        name = 'Sponge'
        url = 'https://repo.spongepowered.org/repository/maven-public'
    }
}

// Declare capabilities on the outgoing configurations.
// NOTE: every capability must be UNIQUE per module. A shared catch-all like
// "$group:$mod_id" is declared by several modules at once, which makes any
// consumer graph containing two Mycel artifacts unresolvable. Loader modules
// select the common variant via the "common" capability (see modloader-loader).
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { variant ->
    configurations."$variant".outgoing {
        capability("$group:${project.name}:$version")
        capability("$group:${base.archivesName.get()}:$version")
        capability("$group:$mod_id-${project.name}-${minecraft_version}:$version")
    }
    publishing.publications.configureEach {
        suppressPomMetadataWarningsFor(variant)
    }
}

jar {
    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : mod_author,
                'Specification-Version' : project.jar.archiveVersion,
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_author,
                'Built-On-Minecraft'    : minecraft_version
        ])
    }
}

processResources {
    var expandProps = [
            'version'                      : version,
            'group'                        : project.group,
            'minecraft_version'            : minecraft_version,
            'minecraft_version_range'      : minecraft_version_range,
            'fabric_version'               : fabric_version,
            'fabric_loader_version'        : fabric_loader_version,
            'forge_version'                : forge_version,
            'forge_loader_version_range'   : forge_loader_version_range,
            'neoforge_version'             : neoforge_version,
            'neoforge_loader_version_range': neoforge_loader_version_range,
            'mod_name'                     : mod_name,
            'mod_author'                   : mod_author,
            'mod_id'                       : mod_id,
            'license'                      : mod_license,
            'description'                  : project.description,
            'credits'                      : credits,
            'java_version'                 : java_version,
            'example_mod_id'               : example_mod_id,
            'example_mod_name'             : example_mod_name
    ]

    var jsonExpandProps = expandProps.collectEntries {
        key, value -> [(key): value instanceof String ? value.replace("\n", "\\\\n") : value]
    }

    filesMatching(['META-INF/mods.toml', 'META-INF/neoforge.mods.toml', 'fabric.mod.json']) {
        expand jsonExpandProps
    }

    inputs.properties(expandProps)
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId base.archivesName.get()
            from components.java
        }
    }
}

// Do NOT publish Gradle Module Metadata: this project's variants and
// capabilities only make sense inside this build (loader disambiguation).
// External consumers (e.g. via JitPack, which serves artifacts under
// different coordinates) address artifacts directly and must resolve through
// the plain POM, otherwise no variant is selectable. Verified by experiment.
tasks.matching { it.name.startsWith('generateMetadataFileFor') }.configureEach {
    enabled = false
}
