plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
}

description = rootProject.description

neoForge {
    neoFormVersion = neo_form_version
    // Automatically enable AccessTransformers if the file exists
    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
}

dependencies {
    testImplementation "org.junit.jupiter:junit-jupiter:${rootProject.junit_version}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Unit tests need Minecraft + platform classes too.
configurations.named('testCompileClasspath') {
    extendsFrom(configurations.getByName('modDevCompileDependencies'))
}
configurations.named('testRuntimeClasspath') {
    extendsFrom(configurations.getByName('modDevRuntimeDependencies'))
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}

// Loader attribute so loader modules consume the right variant.
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { variant ->
    configurations.named("$variant") {
        attributes {
            attribute(loaderAttribute, 'common')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant ->
        configurations.named("$variant") {
            attributes {
                attribute(loaderAttribute, 'common')
            }
        }
    }
}

// API docs, published at https://api.mycelium-gg.org (see firebase.json).
// Internal packages are left out; loader-only members carry @hidden.
tasks.named('javadoc', Javadoc) {
    exclude 'my/celium/org/internal/**'
    title = "Mycel ${project.version} API"
    options {
        windowTitle = "Mycel ${project.version} API"
        overview = file('src/main/javadoc/overview.html').absolutePath
        encoding = 'UTF-8'
        // Every public member is documented, parameters and return values
        // included; a gap or a broken tag fails the build.
        addBooleanOption('Xdoclint:all', true)
        addBooleanOption('Werror', true)
        // Analytics consent banner, shared with the wiki (copy of its assets/consent.js).
        addStringOption('-add-script', file('src/main/javadoc/consent.js').absolutePath)
        links 'https://docs.oracle.com/en/java/javase/25/docs/api/'
        addStringOption('bottom', "Mycel ${project.version} &middot; MIT licensed &middot; <a href=\"https://github.com/MyCelium-GG/MyCel-Lib\">Source</a> &middot; <a href=\"https://wiki.mycelium-gg.org/developing\">Wiki</a>")
    }
}
