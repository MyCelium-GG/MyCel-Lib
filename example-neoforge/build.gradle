plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
}

base {
    archivesName = "${example_mod_id}-neoforge-${minecraft_version}"
}
description = 'Example tiny QoL mod built on the Mycel library (NeoForge).'

configurations {
    exampleCommonJava {
        canBeResolved = true
    }
    exampleCommonResources {
        canBeResolved = true
    }
}

dependencies {
    // Depend on Mycel the way a real mod would (project dep stands in for the maven artifact).
    implementation project(':neoforge')
    exampleCommonJava project(path: ':example-common', configuration: 'commonJava')
    exampleCommonResources project(path: ':example-common', configuration: 'commonResources')
}

tasks.named('compileJava', JavaCompile) {
    dependsOn(configurations.exampleCommonJava)
    source(configurations.exampleCommonJava)
}

processResources {
    dependsOn(configurations.exampleCommonResources)
    from(configurations.exampleCommonResources)
}

neoForge {
    version = neoforge_version
    runs {
        client {
            client()
            gameDirectory = this.mkdir(this.file('runs/client'))
        }
        server {
            server()
            gameDirectory = this.mkdir(this.file('runs/server'))
        }
    }
    mods {
        "${example_mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { variant ->
    configurations.named("$variant") {
        attributes {
            attribute(loaderAttribute, 'neoforge')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName, it.getTaskName(null, 'jarJar')].each { variant ->
        configurations.named("$variant") {
            attributes {
                attribute(loaderAttribute, 'neoforge')
            }
        }
    }
}
