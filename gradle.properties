# Mycel — shared core library for the MyCelium mod ecosystem.
# Minecraft 26.3 / Java 25 / Fabric + Forge + NeoForge.
# Every property used by a loader module must also be listed in
# buildSrc/src/main/groovy/multiloader-common.gradle (expandProps).

# Project / publishing
version=1.0.1
group=my.celium.org
java_version=25

# Common
minecraft_version=26.3
minecraft_version_range=[26.3,26.4)
## NeoForm for MC 26.3, see https://projects.neoforged.net/neoforged/neoform
neo_form_version=26.3-1
mod_id=mycel
mod_name=Mycel
mod_author=MyCelium
mod_license=MIT
credits=The MyCelium contributors
description=Mycel is the shared core library for the MyCelium ecosystem: configuration, utilities, events, networking, translations, update checking and platform abstraction for tiny QoL mods.

# Fabric, see https://fabricmc.net/develop/ for new versions
fabric_version=0.160.6+26.3
fabric_loader_version=0.19.5

# Forge, see https://files.minecraftforge.net/net/minecraftforge/forge/ for new versions
forge_version=26.3-66.0.9
forge_loader_version_range=[66,)
# Required by ForgeGradle 7 (see the official 26.x MDK).
net.minecraftforge.gradle.merge-source-sets=true

# NeoForge, see https://projects.neoforged.net/neoforged/neoforge for new versions
neoforge_version=26.3.0.1-beta
neoforge_loader_version_range=[4,)

# Example mod (proves the API; not published)
example_mod_id=mycelexample
example_mod_name=MycelExample

# Testing
junit_version=5.11.4

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
