# JitPack build configuration.
# Publishes ONE universal artifact loadable on every loader, for one Minecraft
# version per tag: a plain tag (1.4.2) builds the default version from
# gradle.properties, a suffixed tag (1.4.2-26.2, 1.4.2-26.1, pushed by the
# release workflow) builds mc/<line>.properties. Mods depend on
#   com.github.MyCelium-GG:MyCel-Lib:<tag>
# (The per-loader modules exist so each toolchain can compile, but only the
# merged universal jar is published.)
#
# NOTE: Gradle is installed via SDKMAN and invoked directly instead of
# ./gradlew, because JitPack's current image fails to open the wrapper jar
# (valid jar, byte-identical to the one that built 1.1.0). Version must match
# gradle/wrapper/gradle-wrapper.properties.

jdk:
  - openjdk25

install:
  - sdk install gradle 9.7.1
  - MC=$(echo "$VERSION" | sed -n 's/^[0-9]*\.[0-9]*\.[0-9]*-//p'); gradle :universal:publishToMavenLocal -q ${MC:+-Pmc=$MC}

