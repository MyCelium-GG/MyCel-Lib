# JitPack build configuration.
# Publishes ONE universal artifact loadable on every loader:
#   com.github.MyCelium-GG.MyCel-Lib:mycel-26.3:<tag>
# (The per-loader modules exist so each toolchain can compile, but only the
# merged universal jar is published.)

jdk:
  - openjdk25

install:
  - ./gradlew :universal:publishToMavenLocal -q

